<anotoki-dialog
    [heading]="(mode() === 'change' ? 'security.password.changeTitle' : 'security.password.setTitle') | t"
    [description]="(mode() === 'change' ? 'security.password.changeLead' : 'security.password.setLead') | t"
    [busy]="busy()"
    (dismiss)="closed.emit(false)">
    <form id="password-form" class="stack" novalidate (submit)="$event.preventDefault(); submit()">
        @if (freshSignIn()) {
            <app-fresh-sign-in [anchor]="anchor" />
        }
        @if (formError()) {
            <anotoki-alert tone="danger" [announce]="true">{{ formError() }}</anotoki-alert>
        }
        <input class="visually-hidden" type="email" name="username" autocomplete="username" [value]="email()" tabindex="-1" aria-hidden="true" readonly />
        @if (mode() === "change") {
            <anotoki-password-field [label]="'security.password.current' | t" name="current-password" autocomplete="current-password" [(value)]="current" [error]="currentError()" [autofocus]="true" />
        }
        <anotoki-password-field
            [label]="'security.password.new' | t"
            name="new-password"
            autocomplete="new-password"
            [hint]="'common.passwordHint' | t: { count: passwordMin() }"
            [(value)]="next"
            [error]="nextError()"
            [autofocus]="mode() === 'set'" />
        <anotoki-password-field [label]="'security.password.again' | t" name="new-password-again" autocomplete="new-password" [(value)]="again" [error]="againError()" />
        @if (mode() === "change") {
            <anotoki-alert tone="info">{{ "security.password.changeNote" | t }}</anotoki-alert>
        }
    </form>
    <div dialogFooter>
        <button anotokiButton variant="secondary" [disabled]="busy()" (click)="closed.emit(false)">{{ "common.cancel" | t }}</button>
        @if (!freshSignIn()) {
            <button anotokiButton type="submit" form="password-form" variant="primary" [loading]="busy()">
                {{ (mode() === "change" ? "security.password.change" : "security.password.set") | t }}
            </button>
        }
    </div>
</anotoki-dialog>
