<div class="stack">
    <anotoki-alert tone="warning" [heading]="'security.codes.title' | t">{{ "security.codes.lead" | t }}</anotoki-alert>
    <ol class="codes" [attr.aria-label]="'security.codes.title' | t">
        @for (code of codes(); track code) {
            <li>
                <code>{{ code }}</code>
            </li>
        }
    </ol>
    <div class="cluster">
        <anotoki-copy-button [text]="plain()" [label]="'security.codes.copy' | t" />
        <button anotokiButton size="sm" variant="secondary" (click)="download()">
            <anotoki-icon name="download" [size]="16" />
            {{ "security.codes.download" | t }}
        </button>
    </div>
    <anotoki-checkbox [(checked)]="saved">{{ "security.codes.saved" | t }}</anotoki-checkbox>
</div>
