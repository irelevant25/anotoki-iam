<!-- The administrators' announcement, when there is one (the family's site settings): above the frame, as on every anotoki site. -->
<anotoki-announcement />
<anotoki-shell maxWidth="88rem">
    <app-top-bar topBar area="account" />
    @if (deletionDue(); as due) {
        <app-deletion-banner [due]="due" [takeFocus]="drawn()" />
    }
    <router-outlet />
    <anotoki-site-footer shellFooter [version]="changelog.current()" [whatsNew]="changelog.current() !== null" (whatsNew)="changelog.open()" feedback />
</anotoki-shell>
