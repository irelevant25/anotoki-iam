@if (clientId()) {
    @if (divider()) {
        <p class="divider-text">{{ "common.or" | t }}</p>
    }
    <div class="app-google-button__place" #place>
        @if (phase() !== "google") {
            <!-- The IAM's own, drawn here with nothing fetched: Google's "G" in its colours, Google's branding for the button. -->
            <button type="button" class="app-google-button__button" [attr.aria-busy]="phase() === 'loading' ? 'true' : null" [attr.aria-describedby]="failed() ? failedId : null" (click)="press()">
                <svg class="app-google-button__mark" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true" focusable="false">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                </svg>
                <span class="app-google-button__words">{{ words() | t }}</span>
                @if (phase() === "loading") {
                    <anotoki-spinner size="sm" class="app-google-button__spinner" [label]="null" />
                }
            </button>
        }
        <!-- Google's own, drawn after a press: the focus goes to its frame, and the next Tab is Google's button. -->
        <div class="app-google-button__frame" role="group" tabindex="-1" [attr.aria-label]="'google.frame' | t" [hidden]="phase() !== 'google'" #frame>
            <div class="app-google-button__gis" #gis></div>
        </div>
    </div>
    @if (failed()) {
        <p class="app-google-button__failed" role="alert" [id]="failedId">{{ "google.failed" | t }}</p>
    }
    <!-- There before anything is said in it, so that a screen reader hears what is. -->
    <p class="visually-hidden" role="status">
        @if (ready()) {
            {{ "google.ready" | t }}
        }
    </p>
}
