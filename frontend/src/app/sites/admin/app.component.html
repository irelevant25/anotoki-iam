@if (isAdmin()) {
    <anotoki-admin-frame [brand]="brand()" [person]="person()" [back]="back" [signOut]="signOut" [groups]="groups()" navLabel="Admin panel">
        <anotoki-theme-toggle adminFrameTheme />
        <!-- The family's one line while a database update waits (@anotoki/lib): the IAM keeps working meanwhile, and says so only here. -->
        <anotoki-update-banner adminFrameNotice />
        <router-outlet />
        <anotoki-site-footer adminFrameFooter [version]="changelog.current()" [whatsNew]="changelog.current() !== null" (whatsNew)="changelog.open()" feedback />
    </anotoki-admin-frame>
} @else {
    <!-- No access: a page of its own, without the frame's column - the same words and the same way out as ever. -->
    <div class="closed">
        <main class="no-access" id="main">
            @if (deletionPending()) {
                <!-- An administrator who asked for their own account's deletion administers nothing until they cancel it (403 account_deletion_pending). -->
                <anotoki-empty-state
                    icon="clock"
                    heading="Your account is being deleted"
                    text="While its deletion is pending, the admin panel is closed to it. To use the panel again, cancel the deletion on your account page.">
                    <a anotokiButton variant="primary" routerLink="/account">Go to your account</a>
                </anotoki-empty-state>
            } @else {
                <anotoki-empty-state icon="lock" heading="You don't have access" text="The admin panel is for administrators of the anotoki IAM. Your account can still manage itself.">
                    <a anotokiButton variant="primary" routerLink="/account">Go to your account</a>
                </anotoki-empty-state>
            }
        </main>
        <anotoki-site-footer [version]="changelog.current()" [whatsNew]="changelog.current() !== null" (whatsNew)="changelog.open()" feedback />
    </div>
}
