<div class="page">
    <anotoki-page-header heading="Dashboard" lead="The anotoki IAM at a glance." />

    @if (loadError()) {
        <anotoki-error-state heading="The numbers could not be loaded" [message]="loadError()!" (retry)="load()" />
    } @else {
        <ul class="tiles">
            @for (tile of tiles; track tile.key) {
                <li>
                    <a anotokiLinkCard class="tile" [class.tile-warning]="tile.tone === 'warning' && !!stats() && stats()![tile.key] > 0" [routerLink]="tile.link" [queryParams]="tile.query ?? {}">
                        <span class="tile-icon"><anotoki-icon [name]="tile.icon" [size]="18" /></span>
                        <span class="tile-value">
                            @if (stats(); as s) {
                                {{ s[tile.key] }}
                            } @else {
                                <span class="skeleton tile-skeleton" aria-hidden="true"></span>
                                <span class="visually-hidden">Loading</span>
                            }
                        </span>
                        <span class="tile-label">{{ tile.label }}</span>
                    </a>
                </li>
            }
        </ul>
    }

    <section class="stack" aria-labelledby="dashboard-links">
        <h2 id="dashboard-links" class="section-title">Manage</h2>
        <ul class="links">
            @for (item of links; track item.link) {
                <li>
                    <a anotokiLinkCard class="link-card" [routerLink]="item.link">
                        <anotoki-icon [name]="item.icon" [size]="20" />
                        <span>
                            <span class="link-title">{{ item.label }}</span>
                            <span class="link-text">{{ item.text }}</span>
                        </span>
                    </a>
                </li>
            }
        </ul>
    </section>
</div>
