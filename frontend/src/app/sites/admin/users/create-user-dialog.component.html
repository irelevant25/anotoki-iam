<anotoki-dialog heading="Create a user" description="The account is confirmed straight away. Hand the password over and ask them to change it." size="lg" [busy]="busy()" (dismiss)="closed.emit(null)">
    <form id="create-user-form" class="stack" novalidate (submit)="$event.preventDefault(); submit()">
        @if (formError()) {
            <anotoki-alert tone="danger" [announce]="true">{{ formError() }}</anotoki-alert>
        }
        <div class="form-grid">
            <anotoki-text-field
                label="Username"
                name="new-username"
                autocomplete="off"
                autocapitalize="off"
                [maxlength]="100"
                hint="Letters and digits only (a–z, A–Z, 0–9)."
                [(value)]="username"
                [error]="usernameError()"
                [autofocus]="true" />
            <anotoki-text-field label="Email" type="email" name="new-email" autocomplete="off" [(value)]="email" [error]="emailError()" />
            <anotoki-text-field label="Password" name="new-password" autocomplete="off" [(value)]="password" [error]="passwordError()" [hint]="'At least ' + passwordMin() + ' characters.'">
                <span fieldSuffix>
                    <button anotokiButton type="button" variant="ghost" size="sm" (click)="generate()">
                        <anotoki-icon name="dice" [size]="15" />
                        Generate
                    </button>
                </span>
            </anotoki-text-field>
            <anotoki-select label="Language" [options]="languageOptions()" [(value)]="language" />
        </div>
        <anotoki-checkbox [(checked)]="forceChange" hint="They sign in with this password once, then have to pick their own.">Require a new password at the first sign-in</anotoki-checkbox>
        <div class="stack stack-sm">
            <p class="roles-label">Roles</p>
            <p class="muted small">Every new account holds MEMBER in every application; take it away afterwards under Roles.</p>
            <app-role-picker [applications]="applications()" [excluded]="['MEMBER']" [implied]="['MEMBER']" [(selected)]="roles" />
        </div>
    </form>
    <div dialogFooter>
        <button anotokiButton variant="secondary" [disabled]="busy()" (click)="closed.emit(null)">Cancel</button>
        <button anotokiButton type="submit" form="create-user-form" variant="primary" [loading]="busy()">
            <anotoki-icon name="userPlus" [size]="16" />
            Create user
        </button>
    </div>
</anotoki-dialog>
