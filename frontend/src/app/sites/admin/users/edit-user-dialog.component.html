<anotoki-dialog [heading]="'Edit ' + user().username" [busy]="busy()" (dismiss)="closed.emit(null)">
    <form id="edit-user-form" class="stack" novalidate (submit)="$event.preventDefault(); submit()">
        @if (formError()) {
            <anotoki-alert tone="danger" [announce]="true">{{ formError() }}</anotoki-alert>
        }
        <anotoki-text-field
            label="Username"
            name="edit-username"
            autocomplete="off"
            autocapitalize="off"
            [maxlength]="100"
            hint="Letters and digits only (a–z, A–Z, 0–9). An older name with other characters stays until it is changed."
            [(value)]="username"
            [error]="usernameError()"
            [autofocus]="true" />
        <anotoki-text-field label="Email" type="email" name="edit-email" autocomplete="off" [(value)]="email" [error]="emailError()" />
        <anotoki-select label="Language" [options]="languageOptions()" [(value)]="language" />
        <anotoki-checkbox [(checked)]="emailConfirmed" hint="An unconfirmed account cannot sign in until the address is confirmed.">Email address confirmed</anotoki-checkbox>
        <anotoki-checkbox [(checked)]="forceChange" hint="They will have to choose a new password before they can continue to any site.">Require a new password at the next sign-in</anotoki-checkbox>
    </form>
    <div dialogFooter>
        <button anotokiButton variant="secondary" [disabled]="busy()" (click)="closed.emit(null)">Cancel</button>
        <button anotokiButton type="submit" form="edit-user-form" variant="primary" [loading]="busy()">Save</button>
    </div>
</anotoki-dialog>
