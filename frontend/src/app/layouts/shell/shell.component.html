<!-- Focus is moved by hand: with <base href="/">, a bare #main would resolve to /#main and leave the page. -->
<a class="skip-link" href="#main" (click)="$event.preventDefault(); main.focus()">{{ "shell.skipToContent" | t }}</a>

<app-top-bar [area]="area()" />

<div class="frame" [class.has-sidenav]="nav().length > 0">
    @if (nav().length) {
        <nav class="sidenav" aria-label="Admin panel">
            <ul>
                @for (item of nav(); track item.link) {
                    <li>
                        <a class="nav-link" [routerLink]="item.link" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !!item.exact }" ariaCurrentWhenActive="page">
                            <app-icon [name]="item.icon" [size]="18" />
                            <span>{{ item.label }}</span>
                        </a>
                    </li>
                }
            </ul>
        </nav>
    }

    <main #main id="main" class="content" tabindex="-1">
        <ng-content />
    </main>
</div>
