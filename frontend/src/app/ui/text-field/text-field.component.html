<div class="field">
    <label class="field-label" [for]="inputId">
        <span>{{ label() }}</span>
        @if (optional()) {
            <span class="field-optional">{{ "ui.optional" | t }}</span>
        }
    </label>
    <div class="field-control" [class.field-invalid]="!!error()" [class.field-disabled]="disabled()">
        <ng-content select="[fieldPrefix]" />
        <input
            #input
            class="field-input"
            [id]="inputId"
            [attr.name]="name() || null"
            [type]="type()"
            [value]="value()"
            [attr.autocomplete]="autocomplete() || null"
            [attr.inputmode]="inputmode() || null"
            [attr.placeholder]="placeholder() || null"
            [attr.maxlength]="maxlength()"
            [attr.minlength]="minlength()"
            [attr.min]="min()"
            [attr.max]="max()"
            [attr.pattern]="pattern() || null"
            [attr.spellcheck]="spellcheck()"
            [attr.autocapitalize]="autocapitalize() || null"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            [required]="required()"
            [readOnly]="readonly()"
            [disabled]="disabled()"
            (input)="onInput($event)"
            (blur)="blurred.emit()" />
        <ng-content select="[fieldSuffix]" />
    </div>
    @if (hint() && !error()) {
        <p class="field-hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="field-error" [id]="errorId" role="alert">
            <app-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
