<label class="checkbox" [class.is-disabled]="disabled()">
    <input
        type="checkbox"
        [attr.name]="name() || null"
        [checked]="checked()"
        [disabled]="disabled()"
        [attr.aria-describedby]="hint() ? hintId : null"
        (change)="checked.set($any($event.target).checked)" />
    <span class="box" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </span>
    <span class="text">
        <span class="label"><ng-content /></span>
        @if (hint()) {
            <span class="hint" [id]="hintId">{{ hint() }}</span>
        }
    </span>
</label>
