<div class="field" [class.field-inline]="inline()">
    <label class="field-label" [for]="inputId" [class.visually-hidden]="hideLabel()">
        <span>{{ label() }}</span>
    </label>
    <div class="field-control" [class.field-invalid]="!!error()" [class.field-disabled]="disabled()">
        <select
            class="field-input"
            [id]="inputId"
            [attr.name]="name() || null"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            [disabled]="disabled()"
            (change)="value.set($any($event.target).value)">
            @if (placeholder() !== null) {
                <option value="" [selected]="value() === ''">{{ placeholder() }}</option>
            }
            @for (option of options(); track option.value) {
                <option [value]="option.value" [selected]="option.value === value()" [disabled]="option.disabled ?? false">{{ option.label }}</option>
            }
        </select>
    </div>
    @if (hint() && !error()) {
        <p class="field-hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="field-error" [id]="errorId" role="alert">
            <app-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
