<dialog
    #dialog
    class="dialog"
    [attr.data-size]="size()"
    [attr.aria-labelledby]="headingId"
    [attr.aria-describedby]="description() ? descriptionId : null"
    (cancel)="onCancel($event)"
    (keydown)="onKeydown($event)"
    (pointerdown)="pointerDownTarget = $event.target"
    (click)="onClick($event)">
    <div class="panel">
        <header class="header">
            <div class="titles">
                <h2 class="title" [id]="headingId">{{ heading() }}</h2>
                @if (description()) {
                    <p class="description" [id]="descriptionId">{{ description() }}</p>
                }
            </div>
            @if (dismissible()) {
                <button type="button" class="close" [attr.aria-label]="'ui.closeDialog' | t" [disabled]="busy()" (click)="requestDismiss()">
                    <app-icon name="x" [size]="18" />
                </button>
            }
        </header>
        <div class="body">
            <ng-content />
        </div>
        <footer class="footer">
            <ng-content select="[dialogFooter]" />
        </footer>
    </div>
</dialog>
