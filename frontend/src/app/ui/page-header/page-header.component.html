<header class="page-header">
    <div class="titles">
        <ng-content select="[pageEyebrow]" />
        <h1 id="page-title" tabindex="-1">{{ heading() }}</h1>
        @if (lead()) {
            <p class="lead">{{ lead() }}</p>
        }
        <ng-content select="[pageMeta]" />
    </div>
    <div class="actions"><ng-content /></div>
</header>
