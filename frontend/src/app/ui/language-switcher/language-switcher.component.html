@if (languages().length >= 2) {
    @if (segmented()) {
        <div class="segmented" role="radiogroup" [attr.aria-label]="'lang.label' | t" [attr.aria-busy]="switching() ? 'true' : null" (keydown)="onKeydown($event)">
            @for (language of languages(); track language.code) {
                <button
                    #option
                    type="button"
                    role="radio"
                    class="segment"
                    [attr.lang]="language.code"
                    [attr.aria-checked]="i18n.language() === language.code"
                    [attr.aria-label]="language.native_name"
                    [attr.title]="language.native_name"
                    [tabIndex]="focusable() === language.code ? 0 : -1"
                    (click)="choose(language.code)">
                    {{ language.code.toUpperCase() }}
                </button>
            }
        </div>
    } @else {
        <app-select class="chooser" [label]="'lang.label' | t" [hideLabel]="true" [inline]="true" [options]="options()" [disabled]="switching()" [(value)]="selected" (valueChange)="choose($event)" />
    }
}
