@if (languages().length >= 2) {
    @if (compact()) {
        <button
            #button
            type="button"
            class="switcher"
            [id]="buttonId"
            aria-haspopup="menu"
            [attr.aria-expanded]="open()"
            [attr.aria-controls]="menuId"
            [attr.aria-label]="'lang.button' | t: { name: currentName(), code: currentCode() }"
            [attr.aria-busy]="switching() ? 'true' : null"
            (click)="toggle()">
            {{ currentCode() }}
        </button>

        @if (open()) {
            <div #menu class="menu" role="menu" [id]="menuId" [attr.aria-labelledby]="buttonId" (keydown)="onMenuKeydown($event)">
                @for (language of languages(); track language.code) {
                    <button
                        type="button"
                        role="menuitemradio"
                        class="menu-item"
                        [attr.aria-checked]="language.code === i18n.language()"
                        [attr.lang]="language.code"
                        (click)="chooseFromMenu(language.code)">
                        <span class="menu-label">{{ language.native_name }}</span>
                        @if (language.code === i18n.language()) {
                            <app-icon name="check" [size]="16" />
                        }
                    </button>
                }
            </div>
        }
    } @else if (segmented()) {
        <div class="segmented" role="radiogroup" [attr.aria-label]="'lang.label' | t" [attr.aria-busy]="switching() ? 'true' : null" (keydown)="onKeydown($event)">
            @for (language of languages(); track language.code) {
                <button
                    #option
                    type="button"
                    role="radio"
                    class="segment"
                    [attr.lang]="language.code"
                    [attr.aria-checked]="i18n.language() === language.code"
                    [attr.aria-label]="language.native_name"
                    [attr.title]="language.native_name"
                    [tabIndex]="focusable() === language.code ? 0 : -1"
                    (click)="choose(language.code)">
                    {{ language.code.toUpperCase() }}
                </button>
            }
        </div>
    } @else {
        <app-select class="chooser" [label]="'lang.label' | t" [hideLabel]="true" [inline]="true" [options]="options()" [disabled]="switching()" [(value)]="selected" (valueChange)="choose($event)" />
    }
}
