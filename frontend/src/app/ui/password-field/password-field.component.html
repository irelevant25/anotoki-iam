<div class="field">
    <!-- The aside (a "Forgot password?" link) is beside the label, not in it:
       inside, it would become part of the input's accessible name. -->
    <div class="field-label">
        <label [for]="inputId">{{ label() }}</label>
        <ng-content select="[labelAside]" />
    </div>
    <div class="field-control" [class.field-invalid]="!!error()" [class.field-disabled]="disabled()">
        <input
            #input
            class="field-input"
            [id]="inputId"
            [attr.name]="name() || null"
            [type]="visible() ? 'text' : 'password'"
            [value]="value()"
            [attr.autocomplete]="autocomplete()"
            [attr.maxlength]="maxlength()"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            spellcheck="false"
            autocapitalize="off"
            [required]="required()"
            [disabled]="disabled()"
            (input)="onInput($event)" />
        <span class="field-affix">
            <button
                type="button"
                class="reveal"
                [attr.aria-pressed]="visible()"
                [attr.aria-label]="(visible() ? 'ui.hidePassword' : 'ui.showPassword') | t"
                [attr.title]="(visible() ? 'ui.hidePassword' : 'ui.showPassword') | t"
                [disabled]="disabled()"
                (click)="visible.set(!visible())">
                <app-icon [name]="visible() ? 'eyeOff' : 'eye'" [size]="18" />
            </button>
        </span>
    </div>
    @if (hint() && !error()) {
        <p class="field-hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="field-error" [id]="errorId" role="alert">
            <app-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
