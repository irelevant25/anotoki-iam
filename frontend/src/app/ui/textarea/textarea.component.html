<div class="field">
    <label class="field-label" [for]="inputId">
        <span>{{ label() }}</span>
        @if (optional()) {
            <span class="field-optional">{{ "ui.optional" | t }}</span>
        }
    </label>
    <div class="field-control" [class.field-invalid]="!!error()">
        <textarea
            class="field-input"
            [id]="inputId"
            [attr.name]="name() || null"
            [value]="value()"
            [attr.rows]="rows()"
            [attr.maxlength]="maxlength()"
            [attr.placeholder]="placeholder() || null"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            (input)="value.set($any($event.target).value)"></textarea>
    </div>
    @if (hint() && !error()) {
        <p class="field-hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="field-error" [id]="errorId" role="alert">
            <app-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
