<nav class="pagination" aria-label="Pages">
    <p class="range" aria-live="polite">
        @if (total() === 0) {
            Nothing to show
        } @else {
            {{ first() }}-{{ last() }} of {{ total() }}
        }
    </p>
    <div class="buttons">
        <button appButton size="sm" variant="secondary" [disabled]="page() <= 1 || busy()" (click)="pageChange.emit(page() - 1)">
            <app-icon name="chevronLeft" [size]="15" />
            Previous
        </button>
        <span class="page">Page {{ page() }} of {{ pages() }}</span>
        <button appButton size="sm" variant="secondary" [disabled]="page() >= pages() || busy()" (click)="pageChange.emit(page() + 1)">
            Next
            <app-icon name="chevronRight" [size]="15" />
        </button>
    </div>
</nav>
