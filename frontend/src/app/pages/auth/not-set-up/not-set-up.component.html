@if (blocked()) {
    <anotoki-site-status />
    @if (neverInstalled()) {
        <div class="developer">
            <p class="small muted">{{ "notSetUp.developer" | t }}</p>
            <code class="command">cd backend &amp;&amp; php -S localhost:8100 router.php</code>
        </div>
    }
} @else {
    <div class="checking">
        <anotoki-spinner size="lg" [label]="'common.loading' | t" />
    </div>
}
