<app-auth-card>
    @if (!sent()) {
        <header class="auth-head">
            <h1>{{ "forgot.title" | t }}</h1>
            <p>{{ "forgot.lead" | t }}</p>
        </header>
        <form class="form" novalidate (submit)="$event.preventDefault(); submit()">
            @if (formError()) {
                <anotoki-alert tone="danger" [announce]="true">{{ formError() }}</anotoki-alert>
            }
            <anotoki-text-field
                [label]="'common.email' | t"
                type="email"
                name="email"
                autocomplete="username"
                inputmode="email"
                [required]="true"
                [(value)]="email"
                [error]="emailError()"
                [autofocus]="true" />
            <button anotokiButton type="submit" variant="primary" size="lg" [block]="true" [loading]="busy()">
                <anotoki-icon name="send" [size]="16" />
                {{ "forgot.submit" | t }}
            </button>
        </form>
    } @else {
        <header class="auth-head">
            <span class="auth-icon is-success"><anotoki-icon name="mail" [size]="22" /></span>
            <h1 tabindex="-1" anotokiAutofocus>{{ "forgot.sentTitle" | t }}</h1>
            <p>{{ "forgot.sent" | t }}</p>
            <p>{{ "forgot.sentNote" | t }}</p>
        </header>
    }

    <p authFooter class="footer-line">
        <a routerLink="/login" [queryParams]="requestParams()">{{ "forgot.backToSignIn" | t }}</a>
    </p>
</app-auth-card>
