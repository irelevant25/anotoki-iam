<app-alert tone="warning" [announce]="true">
    <p>{{ "deletion.freshSignIn" | t }}</p>
    @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
    }
    <div alertActions>
        <button #button appButton variant="primary" size="sm" [loading]="busy()" (click)="signIn()">
            <app-icon name="logIn" [size]="16" />
            {{ "common.signIn" | t }}
        </button>
    </div>
</app-alert>
