<anotoki-alert tone="warning" [heading]="title()">
    <p>{{ "deletion.pendingText" | t }}</p>
    @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
    }
    <div alertActions>
        <button #cancelButton anotokiButton variant="secondary" size="sm" [loading]="busy()" (click)="cancel()">{{ "deletion.cancel" | t }}</button>
    </div>
</anotoki-alert>
