<app-shell area="admin" [nav]="nav">
    @if (isAdmin()) {
        <router-outlet />
    } @else {
        <div class="no-access">
            <app-empty-state icon="lock" heading="You don't have access" text="The admin panel is for administrators of the anotoki IAM. Your account can still manage itself.">
                <a appButton variant="primary" routerLink="/account">Go to your account</a>
            </app-empty-state>
        </div>
    }
</app-shell>
