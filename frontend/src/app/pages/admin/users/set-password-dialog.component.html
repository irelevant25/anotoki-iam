<app-dialog
    [heading]="'Set a password for ' + user().username"
    description="Every session of the account ends, and its remembered devices are forgotten."
    [busy]="busy()"
    (dismiss)="closed.emit(null)">
    <form id="set-password-form" class="stack" novalidate (submit)="$event.preventDefault(); submit()">
        @if (formError()) {
            <app-alert tone="danger" [announce]="true">{{ formError() }}</app-alert>
        }
        <app-text-field
            label="New password"
            name="admin-new-password"
            autocomplete="off"
            [(value)]="password"
            [error]="passwordError()"
            [hint]="'At least ' + passwordMin() + ' characters.'"
            [autofocus]="true">
            <span fieldSuffix class="field-affix">
                @if (password()) {
                    <app-copy-button [text]="password()" [iconOnly]="true" variant="ghost" />
                }
                <button appButton type="button" variant="ghost" size="sm" (click)="generate()">
                    <app-icon name="dice" [size]="15" />
                    Generate
                </button>
            </span>
        </app-text-field>
        <app-checkbox [(checked)]="forceChange" hint="Recommended: the password has passed through your hands.">Require a new password at the next sign-in</app-checkbox>
    </form>
    <div dialogFooter>
        <button appButton variant="secondary" [disabled]="busy()" (click)="closed.emit(null)">Cancel</button>
        <button appButton type="submit" form="set-password-form" variant="primary" [loading]="busy()">Set password</button>
    </div>
</app-dialog>
