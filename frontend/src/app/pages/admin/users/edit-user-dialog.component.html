<app-dialog [heading]="'Edit ' + user().username" [busy]="busy()" (dismiss)="closed.emit(null)">
    <form id="edit-user-form" class="stack" novalidate (submit)="$event.preventDefault(); submit()">
        @if (formError()) {
            <app-alert tone="danger" [announce]="true">{{ formError() }}</app-alert>
        }
        <app-text-field label="Username" name="edit-username" autocomplete="off" [maxlength]="100" [(value)]="username" [error]="usernameError()" [autofocus]="true" />
        <app-text-field label="Email" type="email" name="edit-email" autocomplete="off" [(value)]="email" [error]="emailError()" />
        <app-select label="Language" [options]="languageOptions()" [(value)]="language" />
        <app-checkbox [(checked)]="emailConfirmed" hint="An unconfirmed account cannot sign in until the address is confirmed.">Email address confirmed</app-checkbox>
        <app-checkbox [(checked)]="forceChange" hint="They will have to choose a new password before they can continue to any site.">Require a new password at the next sign-in</app-checkbox>
    </form>
    <div dialogFooter>
        <button appButton variant="secondary" [disabled]="busy()" (click)="closed.emit(null)">Cancel</button>
        <button appButton type="submit" form="edit-user-form" variant="primary" [loading]="busy()">Save</button>
    </div>
</app-dialog>
