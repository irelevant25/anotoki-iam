<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>anotoki account</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="description" content="One account for every anotoki site." />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#f3f6fb" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="apple-touch-icon" href="anotoki.png" />
        <!-- Before anything is drawn: the stored light/dark choice - the family's script (@anotoki/lib/assets/theme-boot.js), with the IAM's key (shared/kit/kit.config.ts). -->
        <script src="theme-boot.js" data-storage-key="anotoki-iam:theme"></script>
        <!-- The family's visitor counter (Umami). async: no page waits for it. No query string or fragment: a confirm or reset link carries its token there. -->
        <script
            async
            src="https://umami.anotoki.eu/script.js"
            data-website-id="722f2a2f-ed04-43bc-9254-dfaa214ee807"
            data-domains="iam.anotoki.eu"
            data-exclude-search="true"
            data-exclude-hash="true"></script>
    </head>
    <body>
        <app-root></app-root>
        <noscript>
            <p style="font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5">
                Signing in to anotoki needs JavaScript. Please switch it on and reload the page.
            </p>
        </noscript>
    </body>
</html>
